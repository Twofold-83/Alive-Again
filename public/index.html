<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Twofold — a story told by two</title>
<link rel="icon" type="image/png" href="px/candle.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/story.css">
<link rel="stylesheet" href="css/build.css">
<link rel="stylesheet" href="css/dungeon.css">
<link rel="stylesheet" href="css/phone.css">
</head>
<body>

<main id="home" class="screen">
  <button id="homeSound" aria-label="Sound" title="Sound"></button>
  <div class="titlecol">
    <canvas id="titleArt" width="200" height="140" aria-hidden="true"></canvas>
    <h1 class="gametitle">Twofold</h1>
    <p class="subtitle">The Return of the Four-Armed Boy</p>
    <p class="tag">A story told by two.<br>One plays the hero. One plays the whole world.</p>
    <p id="musicHint" class="hint">tap or click anywhere for music</p>
  </div>
  <div class="homebox">
    <div id="devicePick" class="devpick" role="group" aria-label="What are you playing on?">
      <button data-dev="phone">Phone</button>
      <button data-dev="computer">Computer</button>
    </div>
    <select id="lookPick" aria-label="Screen filter"></select>
    <p id="invite" class="invite" hidden></p>
    <input id="name" maxlength="20" placeholder="Your name" autocomplete="nickname" enterkeyhint="done">
    <div id="typePick" class="typepick">
      <span class="dim small">Kind of story</span>
      <button id="typeFree" class="on" data-type="free">Free play<small>Just the stage and your imagination</small></button>
      <button id="typeAdventure" data-type="adventure">Adventure<small>Inventory, stats, levels, maps, battles</small></button>
      <button id="typeRpg" data-type="rpg">Dungeon<small>A hero with a sword against the Overlord’s castle — live or turn-based</small></button>
    </div>
    <div id="newBtns">
      <button id="newDirector" class="big primary">Start a story as Director<small>You control the world, the cast and the music</small></button>
      <button id="newPlayer" class="big">Start a story as Player<small>You are the hero — your partner directs</small></button>
      <div class="or">or on your own</div>
      <div class="row">
        <button id="soloPlayer" class="big grow">Solo Player<small>AI directs</small></button>
        <button id="soloDirector" class="big grow">Solo Director<small>AI is the hero</small></button>
      </div>
      <button id="hotseat" class="big">Play both sides<small>You take every turn yourself — for trying things out</small></button>
      <div class="or">or join a story</div>
    </div>
    <div class="row">
      <input id="joinCode" maxlength="5" placeholder="CODE" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <button id="joinBtn">Join</button>
    </div>
    <p id="homeErr" class="err"></p>
  </div>
</main>

<main id="game" class="screen" hidden>
  <header id="top"></header>
  <div id="clock"><i></i></div>
  <div id="banner" hidden></div>
  <div id="main">
    <div id="left">
      <div id="stageWrap"><div id="stage" class="stage"></div><div id="titleScreen" hidden></div></div>
      <div id="sheet" hidden></div>
    </div>
    <div id="right">
      <section id="panel"></section>
      <footer id="foot"></footer>
    </div>
  </div>
  <div id="rpg" hidden>
    <div id="rpgLeft">
      <div id="rpgHud"></div>
      <div id="rpgWrap"><canvas id="rpgCanvas"></canvas><div id="rpgMsg" hidden></div><div id="rpgCard" hidden></div></div>
      <div id="rpgPad" hidden>
        <div id="rpgStick" aria-label="Walk"><i></i></div>
        <div id="rpgBtns">
          <button id="padPotion" aria-label="Drink a potion"><b></b></button>
          <button id="padBomb" aria-label="Drop a bomb"><b></b></button>
          <button id="padSword" aria-label="Swing your sword"></button>
        </div>
      </div>
    </div>
    <aside id="rpgSide"></aside>
  </div>
</main>

<div id="story" class="overlay" hidden>
  <header><b>The story so far</b><button id="storyClose" class="icon" aria-label="Close">✕</button></header>
  <div class="stageWrap"><div id="storyStage" class="stage"></div></div>
  <p id="storyCap"></p>
  <div class="row center">
    <button id="storyPrev" class="icon" aria-label="Previous">◀</button>
    <button id="storyPlay">▶ Play</button>
    <button id="storyNext" class="icon" aria-label="Next">▶</button>
  </div>
  <button id="storySave" class="link">Download story file</button>
</div>

<div id="workshop" class="ws" hidden></div>

<div id="dollmaker" class="ws" hidden></div>
<div id="toast" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
