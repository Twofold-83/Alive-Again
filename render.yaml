# Render Blueprint: New > Blueprint > pick this repository.
# Free tier: good for trying the game. The service sleeps when idle and has no
# disk, so stories are lost when it sleeps or redeploys.
# For always-on with saved stories, change plan to "starter" and add:
#       - key: DATA_DIR        (under envVars)
#         value: /data
#     disk:
#       name: stories
#       mountPath: /data
#       sizeGB: 1
services:
  - type: web
    name: twofold
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY   # optional: switches on "Tell Claude" for the Director. Enter the key in Render's dashboard.
        sync: false
